# Path → label map for .github/workflows/pr-triage.yml (actions/labeler v7).
#
# Additive only: sync-labels is off, so nothing here ever strips a label a
# human — or Dependabot — put on a PR by hand. Add a path, get a label.
#
# Bare-noun labels, matching the Own Your Stack family vocabulary (redstamp is
# the reference), so a reader moving between repos sees the same words.

detection:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/detect/**'
          - 'src/scan.mjs'
          - 'src/semantic.mjs'
          - 'src/reachability.mjs'

judges:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/judges/**'
          - 'src/score.mjs'

adapters:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/adapters/**'
          - 'src/agentlog.mjs'
          - 'src/envelope.mjs'

schema:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/schema.mjs'
          - 'schema/**'
          - 'profiles/**'

corpus:
  - changed-files:
      - any-glob-to-any-file:
          - 'corpus/**'
          - 'eval/**'

cli:
  - changed-files:
      - any-glob-to-any-file:
          - 'src/cli.mjs'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'test/**'
          - '**/*.test.mjs'

fuzz:
  - changed-files:
      - any-glob-to-any-file:
          - 'fuzz/**'
          - '.clusterfuzzlite/**'

site:
  - changed-files:
      - any-glob-to-any-file:
          - 'site/**'

github_actions:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - '.github/labeler.yml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - 'README.md'
          - 'CHANGELOG.md'
          - 'CONTRIBUTING.md'
          - 'CODE_OF_CONDUCT.md'
          - 'SECURITY.md'
          - 'docs/**'
          - '.github/ISSUE_TEMPLATE/**'
          - '.github/pull_request_template.md'

